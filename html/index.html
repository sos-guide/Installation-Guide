<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SOS GUIDE | Sélection de langue</title>
    <meta name="description" content="Sélectionnez votre langue - SOS GUIDE">
    <style>
        /* Style minimaliste */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: #0a192f;
            color: white;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .container {
            max-width: 800px;
            width: 100%;
            text-align: center;
        }

        .logo {
            margin-bottom: 30px;
        }

        .logo h1 {
            font-size: 2.5rem;
            color: #4dabf7;
            margin-bottom: 10px;
        }

        .logo p {
            color: #8a99b4;
        }

        .language-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
            gap: 15px;
            margin-bottom: 30px;
        }

        .language-card {
            background: #1a2b4d;
            border: 2px solid #2d3f66;
            border-radius: 10px;
            padding: 20px;
            cursor: pointer;
            transition: all 0.3s;
        }

        .language-card:hover {
            background: #2d3f66;
            transform: translateY(-3px);
        }

        .language-card.selected {
            background: #1a4d8f;
            border-color: #4dabf7;
        }

        .flag {
            font-size: 2rem;
            margin-bottom: 10px;
        }

        .name {
            font-weight: bold;
            margin-bottom: 5px;
        }

        .folder {
            font-size: 0.9rem;
            color: #8a99b4;
            font-family: monospace;
        }

        .continue-btn {
            background: #4dabf7;
            color: white;
            border: none;
            padding: 15px 40px;
            font-size: 1.1rem;
            border-radius: 8px;
            cursor: pointer;
            transition: background 0.3s;
        }

        .continue-btn:hover {
            background: #3b8fd9;
        }

        .continue-btn:disabled {
            background: #666;
            cursor: not-allowed;
        }

        /* Loader simple */
        .loader {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(10, 25, 47, 0.95);
            z-index: 1000;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        .loader.active {
            display: flex;
        }

        .spinner {
            width: 50px;
            height: 50px;
            border: 5px solid #2d3f66;
            border-top: 5px solid #4dabf7;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-bottom: 20px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .footer {
            margin-top: 30px;
            color: #8a99b4;
            font-size: 0.9rem;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="logo">
            <h1>⛑️ SOS GUIDE</h1>
            <p>Sélectionnez votre langue / Select your language</p>
        </div>

        <div class="language-grid" id="languageGrid">
            <!-- Les langues seront ajoutées ici -->
        </div>

        <button class="continue-btn" id="continueBtn" disabled>
            Continuer / Continue
        </button>

        <div class="footer">
            Version 1.0 • Fonctionne hors ligne • © 2026
        </div>
    </div>

    <!-- Loader -->
    <div class="loader" id="loader">
        <div class="spinner"></div>
        <p>Chargement...</p>
    </div>

    <script>
        // Données des langues
        const languages = [
            { code: 'fr', name: 'Français', flag: '🇫🇷', folder: 'fr' },
            { code: 'en', name: 'English', flag: '🇬🇧', folder: 'en' },
            { code: 'es', name: 'Español', flag: '🇪🇸', folder: 'es' },
            { code: 'de', name: 'Deutsch', flag: '🇩🇪', folder: 'de' },
            { code: 'it', name: 'Italiano', flag: '🇮🇹', folder: 'it' },
            { code: 'pt', name: 'Português', flag: '🇵🇹', folder: 'pt' },
            { code: 'fi', name: 'Suomi', flag: '🇫🇮', folder: 'fi' },
            { code: 'se', name: 'Svenska', flag: '🇸🇪', folder: 'se' },
            { code: 'ae', name: 'العربية', flag: '🇦🇪', folder: 'ae' }
        ];

        // État
        let selectedLanguage = null;

        // Éléments
        const languageGrid = document.getElementById('languageGrid');
        const continueBtn = document.getElementById('continueBtn');
        const loader = document.getElementById('loader');

        // Créer les cartes de langue
        languages.forEach(lang => {
            const card = document.createElement('div');
            card.className = 'language-card';
            card.innerHTML = `
                <div class="flag">${lang.flag}</div>
                <div class="name">${lang.name}</div>
                <div class="folder">/${lang.folder}/</div>
            `;
            
            card.addEventListener('click', () => {
                // Désélectionner toutes les cartes
                document.querySelectorAll('.language-card').forEach(c => {
                    c.classList.remove('selected');
                });
                
                // Sélectionner cette carte
                card.classList.add('selected');
                selectedLanguage = lang;
                
                // Activer le bouton
                continueBtn.disabled = false;
                continueBtn.textContent = lang.code === 'fr' 
                    ? `Continuer en ${lang.name}` 
                    : `Continue in ${lang.name}`;
            });
            
            languageGrid.appendChild(card);
        });

        // Redirection
        continueBtn.addEventListener('click', () => {
            if (!selectedLanguage) return;
            
            // Afficher le loader
            loader.classList.add('active');
            
            // Rediriger après 1 seconde
            setTimeout(() => {
                window.location.href = `${selectedLanguage.folder}/index.html`;
            }, 1000);
        });

        // Détection auto de la langue
        const browserLang = navigator.language.split('-')[0];
        const matchingLang = languages.find(lang => lang.code === browserLang);
        
        if (matchingLang) {
            // Trouver et cliquer sur la carte correspondante
            setTimeout(() => {
                const cards = document.querySelectorAll('.language-card');
                const index = languages.indexOf(matchingLang);
                if (cards[index]) {
                    cards[index].click();
                }
            }, 100);
        }
    </script>
</body>
</html>
