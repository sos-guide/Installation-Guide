<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0a0d14">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>⛑️ SOS-GUIDE</title>
<style>
/* --- VARIABLES & RESET --- */
:root {
  --bg:       #0a0d14;
  --bg1:      #0f1520;
  --bg2:      #141c2c;
  --card:     #111827;
  --card-h:   #182030;
  --border:   rgba(255,255,255,.08);
  --border-h: rgba(255,255,255,.14);
  --text:     #e8edf5;
  --sub:      #7a8ea8;
  --muted:    #3a4f66;
  --red:      #ff3b5c;
  --blue:     #3b82f6;
  --green:    #22c55e;
  --orange:   #f59e0b;
  --purple:   #a855f7;
  --cyan:     #06b6d4;
  --nav-h:    60px;
  --r:        14px;
  --r-lg:     20px;
}
body.light-mode {
  --bg:       #f8fafc;
  --bg1:      #f1f5f9;
  --bg2:      #e2e8f0;
  --card:     #ffffff;
  --card-h:   #fef9c3;
  --border:   rgba(0,0,0,.08);
  --border-h: rgba(0,0,0,.15);
  --text:     #0f172a;
  --sub:      #475569;
  --muted:    #94a3b8;
}
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { scroll-behavior: smooth; }
body {
  background: var(--bg);
  color: var(--text);
  font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
  line-height: 1.6;
  -webkit-font-smoothing: antialiased;
}
button { font-family: inherit; cursor: pointer; border: none; background: none; }
a { color: inherit; text-decoration: none; }
::-webkit-scrollbar { width: 4px; }
::-webkit-scrollbar-thumb { background: var(--bg2); border-radius: 4px; }
/* --- BARRE DE NAVIGATION --- */
#nav {
  position: fixed; top: 0; left: 0; right: 0; z-index: 800;
  height: var(--nav-h);
  display: flex; align-items: center;
  background: rgba(10,13,20,.92);
  backdrop-filter: blur(16px);
  border-bottom: 1px solid var(--border);
  padding: 0 1.25rem;
  gap: .75rem;
  color: #e8edf5;
}
body.light-mode #nav {
  background: rgba(248,250,252,.92);
  color: #0f172a;
}
.nav-logo {
  font-weight: 800;
  font-size: 1.1rem;
  display: flex;
  align-items: center;
  gap: .4rem;
  flex: 1;
}
.nav-logo em { color: var(--red); font-style: normal; }
.nav-right { display: flex; align-items: center; gap: .5rem; }
.nav-btn {
  width: 36px; height: 36px; border-radius: 10px;
  border: 1px solid rgba(255,255,255,.12);
  background: rgba(255,255,255,.06);
  color: #a0b0c8;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 1.2rem;
  transition: all .15s;
}
.nav-btn:hover {
  background: rgba(255,255,255,.12);
  color: #e8edf5;
  border-color: rgba(255,255,255,.2);
}
body.light-mode .nav-btn {
  background: rgba(0,0,0,.04);
  border-color: rgba(0,0,0,.1);
  color: #334155;
}
body.light-mode .nav-btn:hover {
  background: rgba(0,0,0,.1);
  color: #0f172a;
}
.hamburger {
  width: 40px;
  height: 40px;
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  gap: 6px;
  cursor: pointer;
  background: transparent;
  border: none;
  border-radius: 10px;
  padding: 0;
  transition: background 0.2s;
}
.hamburger:hover {
  background: rgba(255,255,255,.1);
}
body.light-mode .hamburger:hover {
  background: rgba(0,0,0,.08);
}
.hamburger span {
  width: 22px;
  height: 2px;
  background: #ffffff !important;
  border-radius: 2px;
  transition: 0.2s;
}
body.light-mode .hamburger span {
  background: #0f172a !important;
}
/* --- DRAWER (menu latéral) --- */
.drawer-overlay {
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  background: rgba(0,0,0,0.7);
  backdrop-filter: blur(4px);
  z-index: 900;
  visibility: hidden;
  opacity: 0;
  transition: visibility 0.2s, opacity 0.2s;
}
.drawer-overlay.active {
  visibility: visible;
  opacity: 1;
}
.drawer {
  position: fixed;
  top: 0;
  left: 0;
  width: 280px;
  height: 100%;
  background: var(--bg1);
  border-right: 1px solid var(--border);
  transform: translateX(-100%);
  transition: transform 0.25s ease;
  z-index: 1000;
  display: flex;
  flex-direction: column;
  padding: 1.5rem 1rem;
  gap: 1.5rem;
}
.drawer-overlay.active .drawer {
  transform: translateX(0);
}
.drawer-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding-bottom: 1rem;
  border-bottom: 1px solid var(--border);
  font-weight: 700;
  font-size: 1.2rem;
}
.drawer-close {
  background: none;
  border: none;
  font-size: 1.8rem;
  cursor: pointer;
  color: var(--sub);
}
.drawer-nav {
  display: flex;
  flex-direction: column;
  gap: 0.8rem;
}
.drawer-nav a {
  padding: 0.75rem 1rem;
  border-radius: var(--r);
  background: var(--card);
  border: 1px solid var(--border);
  text-align: center;
  font-weight: 600;
  transition: 0.2s;
}
.drawer-nav a:hover {
  background: var(--card-h);
  border-color: var(--red);
  color: var(--red);
}
/* --- MODAL DE SÉLECTION DE LANGUE (grille de cartes) --- */
.lang-modal-overlay {
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  background-color: rgba(0, 0, 0, 0.85);
  backdrop-filter: blur(8px);
  z-index: 10001;
  display: flex;
  align-items: center;
  justify-content: center;
  visibility: hidden;
  opacity: 0;
  transition: visibility 0.2s, opacity 0.2s ease;
}
.lang-modal-overlay.active {
  visibility: visible;
  opacity: 1;
}
.lang-modal-container {
  background: var(--card);
  border-radius: var(--r-lg);
  max-width: 800px;
  width: 90%;
  max-height: 85vh;
  overflow-y: auto;
  border: 1px solid var(--border);
  box-shadow: 0 25px 40px rgba(0,0,0,0.5);
  animation: modalFadeIn 0.2s ease;
}
.lang-modal-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 1rem 1.5rem;
  border-bottom: 1px solid var(--border);
  background: var(--bg1);
  border-radius: var(--r-lg) var(--r-lg) 0 0;
}
.lang-modal-header h3 {
  font-size: 1.2rem;
  font-weight: 700;
}
.lang-modal-close {
  background: none;
  border: none;
  font-size: 1.8rem;
  cursor: pointer;
  color: var(--sub);
}
.lang-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
  gap: 0.75rem;
  padding: 1.5rem;
}
.lang-card {
  background: var(--bg1);
  border: 1px solid var(--border);
  border-radius: var(--r);
  padding: 0.75rem 1rem;
  display: flex;
  align-items: center;
  gap: 0.75rem;
  cursor: pointer;
  transition: all 0.2s;
}
.lang-card:hover {
  background: var(--card-h);
  border-color: var(--red);
  transform: translateY(-2px);
}
.lang-flag {
  font-size: 1.8rem;
}
.lang-name {
  font-size: 1rem;
  font-weight: 500;
  color: var(--text);
}
@keyframes modalFadeIn {
  from { transform: scale(0.96); opacity: 0; }
  to { transform: scale(1); opacity: 1; }
}
/* --- LAYOUT PRINCIPAL (identique à avant) --- */
.main {
  padding-top: calc(var(--nav-h) + 1.5rem);
  padding-bottom: 2rem;
  max-width: 900px;
  margin: 0 auto;
  padding-left: 1.25rem;
  padding-right: 1.25rem;
}
#mainContent { display: none; }
#splashScreen {
  height: 100vh;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 2rem 1rem;
  text-align: center;
  margin-top: -10px;
}
.urgence-grid {
  display: grid;
  grid-template-columns: repeat(2, minmax(160px, 220px));
  gap: 1.5rem;
  width: 100%;
  max-width: 500px;
  margin: 1.5rem auto;
  justify-content: center;
}
.urgence-card {
  display: block;
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: var(--r-lg);
  padding: 1.5rem 0.5rem;
  text-align: center;
  transition: 0.2s;
  cursor: pointer;
  text-decoration: none;
  color: inherit;
}
.urgence-card:hover {
  background: var(--card-h);
  transform: translateY(-3px);
  border-color: var(--border-h);
}
.urgence-number {
  font-size: 2.2rem;
  font-weight: 800;
  letter-spacing: 2px;
  color: var(--red);
}
.urgence-name {
  font-size: 0.9rem;
  color: var(--sub);
  margin-top: 0.5rem;
}
.btn-guide {
  background: rgba(255,255,255,0.12);
  backdrop-filter: blur(8px);
  border: 1px solid rgba(255,255,255,0.4);
  padding: 14px 32px;
  border-radius: 60px;
  font-weight: 700;
  font-size: 1rem;
  color: white;
  margin-top: 1rem;
  transition: 0.2s;
  cursor: pointer;
}
.btn-guide:hover {
  background: rgba(255,255,255,0.25);
  border-color: rgba(255,255,255,0.8);
  transform: scale(1.02);
}
body.light-mode .btn-guide {
  background: rgba(0,0,0,0.08);
  border-color: rgba(0,0,0,0.2);
  color: #0f172a;
}
body.light-mode .btn-guide:hover {
  background: rgba(0,0,0,0.15);
  border-color: rgba(0,0,0,0.4);
}
.hero-icon { font-size: 4rem; margin-bottom: 0.5rem; }
.hero-title {
  font-weight: 800;
  font-size: clamp(1.8rem, 6vw, 2.5rem);
  margin-bottom: 0.5rem;
}
.hero-sub {
  color: var(--sub);
  font-size: 0.95rem;
  max-width: 480px;
  margin: 0 auto;
}
.outils-section { margin-top: 2.5rem; }
.outils-title {
  font-weight: 700;
  font-size: 1.3rem;
  margin-bottom: 1.25rem;
  display: flex;
  align-items: center;
  gap: .5rem;
}
#outilsContainer {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
  gap: 1rem;
}
.outil-card {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: var(--r);
  padding: 1.25rem 1rem;
  text-align: center;
  cursor: pointer;
  transition: all .2s;
  position: relative;
  overflow: hidden;
}
.outil-card:hover {
  background: var(--card-h);
  border-color: var(--border-h);
  transform: translateY(-2px);
}
.outil-card.active {
  border-color: var(--red);
  box-shadow: 0 0 20px rgba(255,59,92,.2);
}
.outil-icon {
  font-size: 2.2rem;
  margin-bottom: .75rem;
  display: inline-block;
  width: 2.5rem;
  height: 2.5rem;
  line-height: 1;
}
.outil-title {
  font-weight: 700;
  font-size: .95rem;
  margin-bottom: .35rem;
}
.outil-desc {
  color: var(--sub);
  font-size: .75rem;
}
.outil-status {
  position: absolute;
  top: .75rem;
  right: .75rem;
  width: 8px;
  height: 8px;
  border-radius: 50%;
  background: var(--muted);
  transition: all .2s;
}
.cards-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
  gap: 1rem;
  margin-top: 0.5rem;
  margin-bottom: 2rem;
}
@media (min-width: 700px) {
  .cards-grid { grid-template-columns: repeat(3, 1fr); }
}
.doc-card {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: var(--r);
  padding: 1rem 0.75rem;
  text-align: center;
  cursor: pointer;
  transition: all 0.2s;
  position: relative;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  min-height: 140px;
  height: auto;
}
.doc-card:hover {
  background: var(--card-h);
  transform: translateY(-2px);
  border-color: var(--border-h);
}
.doc-card-icon {
  font-size: 2.2rem;
  margin-bottom: 0.6rem;
  display: inline-block;
  width: 2.8rem;
  height: 2.8rem;
  line-height: 1;
  text-align: center;
}
.doc-card-title {
  font-weight: 700;
  font-size: 0.9rem;
  margin-bottom: 0.3rem;
  line-height: 1.3;
}
.doc-card-desc {
  color: var(--sub);
  font-size: 0.7rem;
  line-height: 1.3;
  word-break: break-word;
  max-width: 100%;
}
.docs-section, .mental-section, .asso-section {
  margin-top: 2rem;
  margin-bottom: 1rem;
}
.section-title {
  font-weight: 700;
  font-size: 1.3rem;
  margin-bottom: 1rem;
  display: flex;
  align-items: center;
  gap: .5rem;
}
/* --- OVERLAYS OUTILS --- */
#respirationOverlay {
  position: fixed;
  top: 0; left: 0; right: 0; bottom: 0;
  z-index: 9998;
  background: rgba(10,13,20,.95);
  display: none;
  flex-direction: column;
  align-items: center;
  justify-content: center;
}
#respirationOverlay.active { display: flex; }
.respiration-circle {
  width: 200px;
  height: 200px;
  border-radius: 50%;
  background: radial-gradient(circle, var(--blue) 0%, transparent 70%);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 1.5rem;
  font-weight: 700;
  color: #fff;
  animation: breathe 14s ease-in-out infinite;
}
@keyframes breathe {
  0%, 100% { transform: scale(1); opacity: .6; }
  40% { transform: scale(1.8); opacity: 1; }
  60% { transform: scale(1.8); opacity: 1; }
}
.respiration-text {
  margin-top: 2rem;
  color: var(--sub);
  font-size: 1rem;
}
.respiration-stop {
  margin-top: 2rem;
  padding: 12px 24px;
  background: rgba(255,59,92,.9);
  color: #fff;
  border: none;
  border-radius: 50px;
  font-size: 1rem;
  font-weight: 700;
  cursor: pointer;
}
#flashlightOverlay {
  position: fixed;
  top: 0; left: 0; right: 0; bottom: 0;
  z-index: 9996;
  background: white;
  display: none;
}
#flashlightOverlay.active { display: block; }
.flashlight-stop {
  position: absolute;
  bottom: 2rem;
  left: 50%;
  transform: translateX(-50%);
  padding: 14px 28px;
  background: rgba(0,0,0,.8);
  color: #fff;
  border: none;
  border-radius: 50px;
  font-size: 1rem;
  font-weight: 700;
  cursor: pointer;
}
#flashOverlay {
  position: fixed;
  top: 0; left: 0; right: 0; bottom: 0;
  z-index: 9999;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  opacity: 0;
  pointer-events: none;
  transition: opacity .2s;
}
#flashOverlay.active {
  opacity: 1;
  pointer-events: all;
  background-color: black;
}
.flash-stop-btn {
  position: absolute;
  bottom: 2rem;
  left: 50%;
  transform: translateX(-50%);
  padding: 14px 28px;
  background: rgba(0,0,0,0.8);
  color: #fff;
  border: none;
  border-radius: 50px;
  font-size: 1rem;
  font-weight: 700;
  cursor: pointer;
  z-index: 10000;
  backdrop-filter: blur(4px);
}
#cprOverlay {
  position: fixed;
  top: 0; left: 0; right: 0; bottom: 0;
  z-index: 9997;
  background: rgba(0,0,0,0.9);
  display: none;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  backdrop-filter: blur(4px);
}
#cprOverlay.active { display: flex; }
.cpr-metronome {
  text-align: center;
  color: white;
}
.cpr-bpm {
  font-size: 4rem;
  font-weight: bold;
  margin-bottom: 1rem;
}
.cpr-beat {
  width: 80px;
  height: 80px;
  background: var(--red);
  border-radius: 50%;
  margin: 0 auto 2rem;
  transition: transform 0.05s linear;
}
.cpr-beat.active {
  transform: scale(1.2);
  background: #ff6b8a;
}
.cpr-controls {
  display: flex;
  gap: 1rem;
  justify-content: center;
  margin-top: 1rem;
}
.cpr-controls button {
  background: rgba(255,255,255,0.2);
  border: none;
  padding: 10px 20px;
  border-radius: 30px;
  font-size: 1rem;
  font-weight: bold;
  color: white;
  cursor: pointer;
}
.cpr-controls button:hover { background: rgba(255,255,255,0.3); }
.cpr-stop { background: var(--red) !important; }
.cpr-status {
  margin-top: 1rem;
  font-size: 0.9rem;
  opacity: 0.8;
}
/* --- MODAL CONTENU (guides, etc.) --- */
.modal-overlay {
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  background-color: rgba(0, 0, 0, 0.85);
  backdrop-filter: blur(8px);
  z-index: 10000;
  display: flex;
  align-items: center;
  justify-content: center;
  visibility: hidden;
  opacity: 0;
  transition: visibility 0.2s, opacity 0.2s ease;
}
.modal-overlay.active {
  visibility: visible;
  opacity: 1;
}
.modal-container {
  background: var(--card);
  border-radius: var(--r-lg);
  max-width: 550px;
  width: 90%;
  max-height: 80vh;
  overflow-y: auto;
  border: 1px solid var(--border);
  box-shadow: 0 25px 40px rgba(0,0,0,0.5);
  animation: modalFadeIn 0.2s ease;
}
.modal-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 1.2rem 1.5rem;
  border-bottom: 1px solid var(--border);
  background: var(--bg1);
  border-radius: var(--r-lg) var(--r-lg) 0 0;
}
.modal-header h3 {
  font-size: 1.3rem;
  font-weight: 700;
  display: flex;
  align-items: center;
  gap: 0.5rem;
}
.modal-close {
  background: rgba(255,255,255,0.1);
  border: none;
  font-size: 1.5rem;
  cursor: pointer;
  width: 32px;
  height: 32px;
  border-radius: 40px;
  display: flex;
  align-items: center;
  justify-content: center;
  color: var(--text);
  transition: all 0.2s;
}
.modal-close:hover {
  background: rgba(255,59,92,0.3);
  color: var(--red);
}
.modal-body {
  padding: 1.5rem;
  color: var(--text);
  line-height: 1.6;
}
.modal-body p, .modal-body ul, .modal-body li { margin-bottom: 0.75rem; }
.modal-body ul { padding-left: 1.2rem; }
.modal-body strong { color: var(--blue); }
body.light-mode .modal-container {
  background: #ffffff;
  border-color: #e2e8f0;
}
body.light-mode .modal-header { background: #f1f5f9; }
body.light-mode .modal-body { color: #0f172a; }
</style>
</head>
<body>

<nav id="nav">
  <button class="hamburger" id="hamburgerBtn" aria-label="Menu">
    <span></span><span></span><span></span>
  </button>
  <div class="nav-logo">
    <span>⛑️</span>
    <span><em>SOS</em>-GUIDE</span>
  </div>
  <div class="nav-right">
    <button class="nav-btn" id="langBtn" aria-label="Changer de langue">🇫🇷</button>
    <button class="nav-btn" id="themeToggle" aria-label="Changer de thème">🌙</button>
  </div>
</nav>

<!-- DRAWER -->
<div id="drawerOverlay" class="drawer-overlay">
  <div class="drawer">
    <div class="drawer-header">
      <span id="drawerTitle"></span>
      <button class="drawer-close" id="drawerCloseBtn">&times;</button>
    </div>
    <div class="drawer-nav" id="drawerNav"></div>
  </div>
</div>

<!-- MODAL DE SÉLECTION DE LANGUE (avec cartes) -->
<div id="langModal" class="lang-modal-overlay">
  <div class="lang-modal-container">
    <div class="lang-modal-header">
      <h3 id="langModalTitle">🌐</h3>
      <button class="lang-modal-close" id="langModalCloseBtn">&times;</button>
    </div>
    <div class="lang-grid" id="langGrid"></div>
  </div>
</div>

<!-- SPLASH & MAIN CONTENT -->
<div id="splashScreen"></div>
<div id="mainContent">
  <div class="main">
    <div id="outils-section" class="outils-section">
      <h2 class="outils-title" id="outilsTitle"></h2>
      <div id="outilsContainer"></div>
    </div>
    <div id="guides-section" class="docs-section">
      <div class="section-title" id="guidesTitle"></div>
      <div id="docsCardsGrid" class="cards-grid"></div>
    </div>
    <div id="asso-section" class="asso-section">
      <div class="section-title" id="assosTitle"></div>
      <div id="assoCardsGrid" class="cards-grid"></div>
    </div>
    <div id="mental-section" class="mental-section">
      <div class="section-title" id="mentalTitle"></div>
      <div id="mentalCardsGrid" class="cards-grid"></div>
    </div>
  </div>
</div>

<!-- MODAL CONTENU (guides, etc.) -->
<div id="docModal" class="modal-overlay">
  <div class="modal-container">
    <div class="modal-header">
      <h3><span id="modalIcon">📘</span> <span id="modalTitle"></span></h3>
      <button class="modal-close" id="closeModalBtn">&times;</button>
    </div>
    <div class="modal-body" id="modalBodyContent"></div>
  </div>
</div>

<!-- OVERLAYS OUTILS -->
<div id="flashOverlay"><button class="flash-stop-btn" id="flashStopBtn"></button></div>
<div id="respirationOverlay">
  <div class="respiration-circle" id="respirationCircle"></div>
  <div class="respiration-text" id="respirationText"></div>
  <button class="respiration-stop" id="respirationStopBtn"></button>
</div>
<div id="flashlightOverlay"><button class="flashlight-stop" id="flashlightStopBtn"></button></div>
<div id="cprOverlay">
  <div class="cpr-metronome">
    <div class="cpr-bpm" id="cprBpm">110 BPM</div>
    <div class="cpr-beat" id="cprBeat"></div>
    <div class="cpr-controls">
      <button id="cprStopBtn" class="cpr-stop"></button>
    </div>
    <div class="cpr-status" id="cprStatus"></div>
  </div>
</div>

<script>
// =================== LISTE DES LANGUES DISPONIBLES ===================
const availableLanguages = [
  { code: 'fr', flag: '🇫🇷', label: 'Français' },
  { code: 'en', flag: '🇬🇧', label: 'English' },
  { code: 'es', flag: '🇪🇸', label: 'Español' },
  { code: 'de', flag: '🇩🇪', label: 'Deutsch' },
  { code: 'it', flag: '🇮🇹', label: 'Italiano' },
  { code: 'pt', flag: '🇵🇹', label: 'Português' },
  { code: 'nl', flag: '🇳🇱', label: 'Nederlands' },
  { code: 'pl', flag: '🇵🇱', label: 'Polski' },
  { code: 'ru', flag: '🇷🇺', label: 'Русский' },
  { code: 'ar', flag: '🇸🇦', label: 'العربية' },
  { code: 'zh', flag: '🇨🇳', label: '中文' },
  { code: 'ja', flag: '🇯🇵', label: '日本語' },
  { code: 'tr', flag: '🇹🇷', label: 'Türkçe' },
  { code: 'el', flag: '🇬🇷', label: 'Ελληνικά' },
  { code: 'sv', flag: '🇸🇪', label: 'Svenska' },
  { code: 'da', flag: '🇩🇰', label: 'Dansk' },
  { code: 'no', flag: '🇳🇴', label: 'Norsk' },
  { code: 'fi', flag: '🇫🇮', label: 'Suomi' },
  { code: 'cs', flag: '🇨🇿', label: 'Čeština' },
  { code: 'hu', flag: '🇭🇺', label: 'Magyar' },
  { code: 'ro', flag: '🇷🇴', label: 'Română' },
  { code: 'uk', flag: '🇺🇦', label: 'Українська' },
  { code: 'he', flag: '🇮🇱', label: 'עברית' },
  { code: 'th', flag: '🇹🇭', label: 'ไทย' },
  { code: 'vi', flag: '🇻🇳', label: 'Tiếng Việt' },
  { code: 'ko', flag: '🇰🇷', label: '한국어' },
  { code: 'hi', flag: '🇮🇳', label: 'हिन्दी' }
];

let currentLang = 'fr';
let appData = null;
let flashActive = false, respirationActive = false, flashlightActive = false, soundActive = false, cprActive = false;
let flashInterval = null, respirationTimeout = null;
let cprInterval = null;
let cprAudioCtx = null;
let soundCtx = null, soundOsc = null, soundGain = null;

function escapeHtml(str) { if(!str) return ''; return str.replace(/[&<>]/g, function(m){ if(m==='&') return '&amp;'; if(m==='<') return '&lt;'; if(m==='>') return '&gt;'; return m;}); }

function updateOutilUI(id, actif) {
  const card = document.querySelector(`[data-outil="${id}"]`);
  const status = document.getElementById(`status-${id}`);
  if (card) card.classList.toggle('active', actif);
  if (status) status.style.background = actif ? 'var(--green)' : '';
}

// Flash SOS
function startFlash() { if (flashActive) return; flashActive = true; updateOutilUI('flash', true); const overlay = document.getElementById('flashOverlay'); overlay.classList.add('active'); const pattern = [{ color: 'white', dur: 300 },{ color: 'black', dur: 300 },{ color: 'white', dur: 300 },{ color: 'black', dur: 300 },{ color: 'white', dur: 300 },{ color: 'black', dur: 300 },{ color: 'white', dur: 700 },{ color: 'black', dur: 700 },{ color: 'white', dur: 700 },{ color: 'black', dur: 700 },{ color: 'white', dur: 700 },{ color: 'black', dur: 700 },{ color: 'white', dur: 300 },{ color: 'black', dur: 300 },{ color: 'white', dur: 300 },{ color: 'black', dur: 300 },{ color: 'white', dur: 300 },{ color: 'black', dur: 1000 }]; let idx = 0; function step() { if (!flashActive) return; overlay.style.backgroundColor = pattern[idx].color; flashInterval = setTimeout(() => { idx = (idx + 1) % pattern.length; step(); }, pattern[idx].dur); } step(); }
function stopFlash() { flashActive = false; if (flashInterval) clearTimeout(flashInterval); const overlay = document.getElementById('flashOverlay'); overlay.classList.remove('active'); overlay.style.backgroundColor = ''; updateOutilUI('flash', false); }
window.stopFlash = stopFlash;
function toggleFlash() { flashActive ? stopFlash() : startFlash(); }

// Respiration
function startRespiration() { if (respirationActive) return; respirationActive = true; updateOutilUI('respiration', true); const overlay = document.getElementById('respirationOverlay'); const circle = document.getElementById('respirationCircle'); overlay.classList.add('active'); const texts = appData.respirationTexts; function cycle() { if (!respirationActive) return; circle.textContent = texts.inhale; respirationTimeout = setTimeout(() => { if (!respirationActive) return; circle.textContent = texts.hold; respirationTimeout = setTimeout(() => { if (!respirationActive) return; circle.textContent = texts.exhale; respirationTimeout = setTimeout(cycle, 6000); }, 4000); }, 4000); } cycle(); document.getElementById('respirationText').textContent = texts.instruction; }
function stopRespiration() { respirationActive = false; if (respirationTimeout) clearTimeout(respirationTimeout); const overlay = document.getElementById('respirationOverlay'); overlay.classList.remove('active'); updateOutilUI('respiration', false); }
window.stopRespiration = stopRespiration;
function toggleRespiration() { respirationActive ? stopRespiration() : startRespiration(); }

// Lampe torche
function startFlashlight() { flashlightActive = true; updateOutilUI('flashlight', true); document.getElementById('flashlightOverlay').classList.add('active'); }
function stopFlashlight() { flashlightActive = false; updateOutilUI('flashlight', false); document.getElementById('flashlightOverlay').classList.remove('active'); }
window.stopFlashlight = stopFlashlight;
function toggleFlashlight() { flashlightActive ? stopFlashlight() : startFlashlight(); }

// Alarme sonore
function startSoundAlarm() { if (soundActive) return; try { soundCtx = new (window.AudioContext || window.webkitAudioContext)(); soundOsc = soundCtx.createOscillator(); soundGain = soundCtx.createGain(); soundOsc.type = 'sawtooth'; soundOsc.frequency.value = 880; soundGain.gain.value = 0.4; soundOsc.connect(soundGain); soundGain.connect(soundCtx.destination); soundOsc.start(); soundActive = true; updateOutilUI('soundAlarm', true); if (soundCtx.state === 'suspended') soundCtx.resume(); } catch(e) { console.warn(e); } }
function stopSoundAlarm() { if (!soundActive) return; try { if (soundOsc) soundOsc.stop(); if (soundCtx) soundCtx.close(); } catch(e) {} soundOsc = null; soundGain = null; soundCtx = null; soundActive = false; updateOutilUI('soundAlarm', false); }
function toggleSoundAlarm() { soundActive ? stopSoundAlarm() : startSoundAlarm(); }

// CPR Metronome (fixe 110 BPM)
function playCprBeep() { if (!cprActive) return; try { if (!cprAudioCtx) cprAudioCtx = new (window.AudioContext || window.webkitAudioContext)(); if (cprAudioCtx.state === 'suspended') cprAudioCtx.resume(); const now = cprAudioCtx.currentTime; const osc = cprAudioCtx.createOscillator(); const gain = cprAudioCtx.createGain(); osc.type = 'sine'; osc.frequency.value = 880; gain.gain.value = 0.25; gain.gain.exponentialRampToValueAtTime(0.00001, now + 0.25); osc.connect(gain); gain.connect(cprAudioCtx.destination); osc.start(); osc.stop(now + 0.25); } catch(e) { console.warn(e); } }
function startCprInterval() { if (cprInterval) clearInterval(cprInterval); const intervalMs = 60000 / 110; cprInterval = setInterval(() => { if (!cprActive) return; playCprBeep(); const beat = document.getElementById('cprBeat'); beat.classList.add('active'); setTimeout(() => beat.classList.remove('active'), 100); }, intervalMs); }
function updateCprBpmDisplay() { document.getElementById('cprBpm').innerHTML = "110 BPM"; const status = document.getElementById('cprStatus'); if (status && appData) status.innerHTML = appData.cprMessages.good; }
function startCprMetronome() { if (cprActive) return; cprActive = true; updateOutilUI('cprMetronome', true); document.getElementById('cprOverlay').classList.add('active'); updateCprBpmDisplay(); startCprInterval(); }
function stopCprMetronome() { cprActive = false; if (cprInterval) clearInterval(cprInterval); if (cprAudioCtx) cprAudioCtx.close(); cprAudioCtx = null; document.getElementById('cprOverlay').classList.remove('active'); updateOutilUI('cprMetronome', false); }
function toggleCprMetronome() { cprActive ? stopCprMetronome() : startCprMetronome(); }

// Rendu des sections
function renderSplash() {
  const splashDiv = document.getElementById('splashScreen');
  if (!splashDiv || !appData) return;
  const urgences = appData.urgences || [];
  const urgGrid = urgences.map(u => `<a href="tel:${u.tel}" class="urgence-card"><div class="urgence-number">${escapeHtml(u.number)}</div><div class="urgence-name">${escapeHtml(u.name)}</div></a>`).join('');
  splashDiv.innerHTML = `
    <div class="hero-icon">⛑️</div>
    <h1 class="hero-title">${escapeHtml(appData.splash.title)}</h1>
    <p class="hero-sub">${escapeHtml(appData.splash.subtitle)}</p>
    <div class="urgence-grid">${urgGrid}</div>
    <button class="btn-guide" id="accessGuideBtn">${escapeHtml(appData.splash.guideButton)}</button>
  `;
  const guideBtn = document.getElementById('accessGuideBtn');
  if (guideBtn) guideBtn.onclick = () => { document.getElementById('splashScreen').style.display = 'none'; document.getElementById('mainContent').style.display = 'block'; };
}

function renderOutils() {
  const container = document.getElementById('outilsContainer');
  if (!container || !appData) return;
  const outils = appData.outils || [];
  container.innerHTML = outils.map(outil => `
    <div class="outil-card" data-outil="${outil.id}" onclick="window['toggle${outil.func}']()">
      <div class="outil-icon">${outil.icon}</div>
      <div class="outil-title">${escapeHtml(outil.title)}</div>
      <div class="outil-desc">${escapeHtml(outil.desc)}</div>
      <div class="outil-status" id="status-${outil.id}"></div>
    </div>
  `).join('');
}

function renderCards(containerId, items, clickHandler) {
  const container = document.getElementById(containerId);
  if (!container) return;
  container.innerHTML = items.map(item => `
    <div class="doc-card" data-idx="${items.indexOf(item)}">
      <div class="doc-card-icon">${escapeHtml(item.icon)}</div>
      <div class="doc-card-title">${escapeHtml(item.title || item.name)}</div>
      <div class="doc-card-desc">${escapeHtml(item.desc)}</div>
    </div>
  `).join('');
  Array.from(container.children).forEach((card, idx) => {
    card.addEventListener('click', () => clickHandler(items[idx]));
  });
}

function openModal(item) {
  if (!item) return;
  document.getElementById('modalIcon').textContent = item.icon || '📘';
  document.getElementById('modalTitle').textContent = item.title || item.name;
  document.getElementById('modalBodyContent').innerHTML = item.content;
  document.getElementById('docModal').classList.add('active');
  document.body.style.overflow = 'hidden';
}

function renderAll() {
  if (!appData) return;
  document.getElementById('outilsTitle').innerHTML = appData.sections.outilsTitle;
  document.getElementById('guidesTitle').innerHTML = appData.sections.guidesTitle;
  document.getElementById('assosTitle').innerHTML = appData.sections.assosTitle;
  document.getElementById('mentalTitle').innerHTML = appData.sections.mentalTitle;
  document.getElementById('drawerTitle').innerHTML = appData.drawer.title;
  const drawerNav = document.getElementById('drawerNav');
  if (drawerNav) {
    drawerNav.innerHTML = appData.drawer.links.map(link => `<a href="#" data-scroll="${link.scroll}">${link.icon} ${link.label}</a>`).join('');
    drawerNav.querySelectorAll('a').forEach(a => {
      a.addEventListener('click', (e) => {
        e.preventDefault();
        const targetId = a.getAttribute('data-scroll');
        if (targetId) {
          document.getElementById('splashScreen').style.display = 'none';
          document.getElementById('mainContent').style.display = 'block';
          setTimeout(() => { const el = document.getElementById(targetId); if(el) el.scrollIntoView({ behavior: 'smooth', block: 'start' }); }, 100);
        }
        document.getElementById('drawerOverlay').classList.remove('active');
        document.body.style.overflow = '';
      });
    });
  }
  // Mise à jour des boutons techniques
  if (appData.buttons) {
    const flashStop = document.getElementById('flashStopBtn');
    if (flashStop) flashStop.textContent = appData.buttons.flashStop;
    const respirationStop = document.getElementById('respirationStopBtn');
    if (respirationStop) respirationStop.textContent = appData.buttons.respirationStop;
    const flashlightStop = document.getElementById('flashlightStopBtn');
    if (flashlightStop) flashlightStop.textContent = appData.buttons.flashlightStop;
    const cprStop = document.getElementById('cprStopBtn');
    if (cprStop) cprStop.textContent = appData.buttons.cprStop;
  }
  renderSplash();
  renderOutils();
  renderCards('docsCardsGrid', appData.guides, openModal);
  renderCards('assoCardsGrid', appData.associations, openModal);
  renderCards('mentalCardsGrid', appData.mental, openModal);
  // Attacher les fonctions globales
  window.toggleFlash = toggleFlash;
  window.toggleRespiration = toggleRespiration;
  window.toggleFlashlight = toggleFlashlight;
  window.toggleSoundAlarm = toggleSoundAlarm;
  window.toggleCprMetronome = toggleCprMetronome;
}

async function loadLanguage(lang) {
  try {
    const response = await fetch(`data/${lang}.json`);
    if (!response.ok) throw new Error(`HTTP ${response.status}`);
    const data = await response.json();
    appData = data;
    currentLang = lang;
    localStorage.setItem('sos_lang', lang);
    document.documentElement.lang = lang;
    // Mettre à jour le drapeau dans le bouton
    const found = availableLanguages.find(l => l.code === lang);
    const langBtn = document.getElementById('langBtn');
    if (found) langBtn.textContent = found.flag;
    else langBtn.textContent = '🌐';
    renderAll();
  } catch (err) {
    console.error("Erreur chargement langue:", err);
    document.getElementById('splashScreen').innerHTML = `<div style="color:red; text-align:center; margin-top:20vh;">❌ Erreur de chargement des données (${lang}). Vérifiez que le fichier data/${lang}.json existe.</div>`;
  }
}

// Génération du contenu du modal de sélection de langue (grille de cartes)
function populateLangModal() {
  const grid = document.getElementById('langGrid');
  if (!grid) return;
  grid.innerHTML = '';
  availableLanguages.forEach(lang => {
    const card = document.createElement('div');
    card.className = 'lang-card';
    card.innerHTML = `
      <div class="lang-flag">${lang.flag}</div>
      <div class="lang-name">${escapeHtml(lang.label)}</div>
    `;
    card.addEventListener('click', () => {
      loadLanguage(lang.code);
      closeLangModal();
    });
    grid.appendChild(card);
  });
}

function openLangModal() {
  const modal = document.getElementById('langModal');
  if (modal) modal.classList.add('active');
  document.body.style.overflow = 'hidden';
}
function closeLangModal() {
  const modal = document.getElementById('langModal');
  if (modal) modal.classList.remove('active');
  document.body.style.overflow = '';
}

document.addEventListener('DOMContentLoaded', () => {
  // Thème
  (function initTheme() {
    let savedTheme = 'dark';
    try { const stored = localStorage.getItem('sos_theme'); if (stored !== null) savedTheme = stored; else savedTheme = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'; } catch(e) {}
    const isLight = savedTheme === 'light';
    document.body.classList.toggle('light-mode', isLight);
    const themeBtn = document.getElementById('themeToggle');
    if (themeBtn) themeBtn.textContent = isLight ? '☀️' : '🌙';
  })();
  // Remplir le modal de langues
  populateLangModal();
  // Charger la langue sauvegardée ou français par défaut
  let savedLang = 'fr';
  try { if (localStorage.getItem('sos_lang')) savedLang = localStorage.getItem('sos_lang'); } catch(e) {}
  loadLanguage(savedLang);
  // Événements UI
  document.getElementById('themeToggle').addEventListener('click', () => {
    const isLight = document.body.classList.toggle('light-mode');
    localStorage.setItem('sos_theme', isLight ? 'light' : 'dark');
    document.getElementById('themeToggle').textContent = isLight ? '☀️' : '🌙';
  });
  // Drawer
  const drawerOverlay = document.getElementById('drawerOverlay');
  const hamburgerBtn = document.getElementById('hamburgerBtn');
  const drawerCloseBtn = document.getElementById('drawerCloseBtn');
  hamburgerBtn.onclick = () => { drawerOverlay.classList.add('active'); document.body.style.overflow = 'hidden'; };
  drawerCloseBtn.onclick = () => { drawerOverlay.classList.remove('active'); document.body.style.overflow = ''; };
  drawerOverlay.addEventListener('click', (e) => { if (e.target === drawerOverlay) { drawerOverlay.classList.remove('active'); document.body.style.overflow = ''; } });
  // Modal langue
  const langBtn = document.getElementById('langBtn');
  const langModalClose = document.getElementById('langModalCloseBtn');
  const langModalOverlay = document.getElementById('langModal');
  langBtn.addEventListener('click', openLangModal);
  langModalClose.addEventListener('click', closeLangModal);
  langModalOverlay.addEventListener('click', (e) => { if (e.target === langModalOverlay) closeLangModal(); });
  // Modal document (guides)
  const docModalOverlay = document.getElementById('docModal');
  const closeModalBtn = document.getElementById('closeModalBtn');
  closeModalBtn.onclick = () => { docModalOverlay.classList.remove('active'); document.body.style.overflow = ''; };
  docModalOverlay.addEventListener('click', (e) => { if (e.target === docModalOverlay) { docModalOverlay.classList.remove('active'); document.body.style.overflow = ''; } });
  // CPR stop
  document.getElementById('cprStopBtn')?.addEventListener('click', () => toggleCprMetronome());
  // Nettoyage avant fermeture
  window.addEventListener('beforeunload', () => {
    if (soundActive) stopSoundAlarm();
    if (flashActive) stopFlash();
    if (respirationActive) stopRespiration();
    if (flashlightActive) stopFlashlight();
    if (cprActive) stopCprMetronome();
  });
});
</script>
</body>
</html>
